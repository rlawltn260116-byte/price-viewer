<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>경쟁사 가격 모니터링</title>
<style>
body{margin:0;background:#F3F5F8;font-family:'맑은 고딕','Malgun Gothic',sans-serif;color:#222}
.wrap{max-width:900px;margin:24px auto;background:#fff;border:1px solid #E1E8F0;border-radius:8px;padding:24px 28px}
h1{font-size:18px;margin:0 0 4px;color:#1F3864}
h3{font-size:15px;margin:22px 0 4px}
.sub{color:#666;font-size:12px;margin-bottom:6px}
.note{font-size:12px;color:#666;margin:2px 0 0;line-height:1.6}
.hint{font-size:12px;color:#666;margin-top:16px;line-height:1.6;border-top:1px solid #eee;padding-top:10px}
table.sm{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 4px}
table.sm th{background:#1F3864;color:#fff;padding:7px 8px;text-align:center;border:1px solid #ccc;white-space:nowrap}
table.sm td{padding:7px 8px;border:1px solid #ddd;text-align:center;white-space:nowrap}
a.num{font-weight:700;text-decoration:underline;cursor:pointer}
.av{color:#666;font-size:12px}
.btn{display:inline-block;margin-top:8px;padding:8px 14px;border:1px solid #1F3864;border-radius:6px;background:#fff;color:#1F3864;font-weight:600;cursor:pointer;font-family:inherit}
.ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.45);z-index:10;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:#fff;border-radius:8px;width:100%;max-width:1280px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.md-h{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px 12px;border-bottom:1px solid #E5E7EB}
.md-h h2{margin:0;font-size:16px;color:#1F3864}
.lg{font-size:11px;color:#777;margin-top:4px;line-height:1.5}
.x{cursor:pointer;font-size:26px;line-height:1;color:#999;border:0;background:none;padding:0 4px}
.x:hover{color:#333}
.md-b{overflow:auto;padding:0 20px 16px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;margin-top:12px}
table.dt th{position:sticky;top:0;background:#F3F4F6;padding:8px var(--px,10px);border:1px solid #E5E7EB;border-left:0;text-align:center;white-space:nowrap;cursor:pointer;user-select:none;font-weight:600}
table.dt th:first-child{border-left:1px solid #E5E7EB}
table.dt th:hover{background:#E5E7EB}
table.dt th .s{color:#B0B7C3;margin-left:3px;font-size:10px}
table.dt th.on .s{color:#1F3864}
table.dt td{padding:7px var(--px,10px);border-right:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;white-space:nowrap}
table.dt td:first-child{border-left:1px solid #E5E7EB}
table.dt td.t{text-align:left}
table.dt td.c{text-align:center}
table.dt td.nm{white-space:normal;min-width:120px}
table.dt.tight td.t{white-space:normal}table.dt.tight td.nm{min-width:80px}
table.dt.ct tbody tr td.cat,table.dt.ct tbody tr td.sub{background:#F7F9FC;vertical-align:top}table.dt.ct td.cat{font-weight:600}table.dt.ct td.sub{font-weight:700;color:#1F3864}table.dt.ct tbody tr.tot td{background:#EEF2F8;font-weight:700}table.dt.ct td.dim{color:#888}table.dt.ct th{cursor:default}
table.dt td.r{text-align:right}
table.dt tbody tr:nth-child(even) td{background:#FAFBFC}
.pos{color:#C00000;font-weight:600}.neg{color:#1F4E9E;font-weight:600}.zero{color:#888}
@media (max-width:640px){.wrap{margin:0;border:0;border-radius:0;padding:16px}table.sm th,table.sm td{padding:6px 4px;font-size:12px}}
</style></head><body>
<div class="wrap">
<h1 id="ttl">경쟁사 가격 모니터링</h1>
<div class="sub" id="msg">불러오는 중…</div>
<div id="sec-o"></div>
<div id="sec-p"></div>
<div id="sec-g"></div>
<div id="sec-s"></div>
<div class="hint" id="hint" style="display:none">목록 헤더를 클릭하면 정렬됩니다(한 번 더 클릭하면 반대 순서). 상품명에 마우스를 올리면 급여코드가 보입니다. 팝업은 Esc 또는 바깥을 누르면 닫힙니다.</div>
<button class="btn" id="again" style="display:none">목록 다시 열기</button>
</div>
<div class="ov" id="ov"><div class="md">
<div class="md-h"><div><h2 id="mt"></h2><div class="lg" id="lg"></div></div><button class="x" id="x" aria-label="닫기">×</button></div>
<div class="md-b" id="mb"><table class="dt"><thead id="dh"></thead><tbody id="tb"></tbody></table></div>
</div></div>
<script>
(function PAGE_SCRIPT(CFG, EMBED) {
  var INDEF = '무기한(일정 미정)';
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var PF = { all: '비교상품 전체', self: '조아 저가', comp: '경쟁사 저가', same: '동일' };
  var GF = { all: '비교 건수', self: '조아 더 저렴', comp: '경쟁사 더 저렴' };
  var SF = { neu: '신규 지연·품절', res: '해소', cur: '현재 지연·품절', indef: '무기한' };
  var PLEG = '사업소 매익률 = (급여가 − 금액) ÷ 급여가 · 차액 = 조아 금액 − 경쟁사 금액 · 매익률 차이 = 경쟁사 매익률 − 조아 매익률 (빨강: 조아가 비쌈 · 파랑: 조아가 저렴)';
  var SLEG = '구분 — 신규 발생: 오늘 새로 지연·품절 · 지속: 어제와 같음 · 변경: 상태나 일정이 바뀜 · 해소: 오늘 정상화 · 신규상품: 오늘 처음 수집된 상품 (출고 예정·안내 문구는 각 사이트 표기 그대로)';
  var PCOLS = [
    { h: '품목군', a: 't' }, { h: '상품명', a: 't', w: 1, tip: 1 }, { h: '급여가', a: 'r', k: 'n' }, { h: '조아 금액', a: 'r', k: 'n' },
    { h: '조아 사업소 매익률', a: 'r', k: 'p0' }, { h: '경쟁사 금액', a: 'r', k: 'n' }, { h: '경쟁사 사업소 매익률', a: 'r', k: 'p0' },
    { h: '차액', a: 'r', k: 'n', sg: 1 }, { h: '매익률 차이', a: 'r', k: 'p1', sg: 1 }
  ];
  var SCOLS = [
    { h: '품목군', a: 't' }, { h: '상품명', a: 't', w: 1, tip: 1 }, { h: '상태', a: 'c' },
    { h: '출고 예정', a: 'c', hl: function (v) { return v === INDEF ? 'pos' : ''; } },
    { h: '안내 문구', a: 't', w: 1 },
    { h: '구분', a: 'c', hl: function (v) { return v === '신규 발생' ? 'pos' : v === '해소' ? 'neg' : ''; } }
  ];
  var UF = { up: '판매가 인상', down: '판매가 인하' };
  var NF = { add: '신규 상품', del: '삭제된 상품' };
  var ULEG = '변동액 = 금일 − 전일 판매가 · 변동률 = 변동액 ÷ 전일 판매가 (빨강: 인상 · 파랑: 인하)';
  var NLEG = { add: '오늘 처음 보이는 상품 (어제 목록에는 없음)', del: '어제는 있었는데 오늘 목록에 없는 상품 (판매가는 어제 기준)' };
  var QLEG = '할인율 = (판매가 − 수량할인가) ÷ 판매가 · 할인 조건은 사이트 표기 그대로';
  var UCOLS = [{ h: '품목군', a: 't' }, { h: '상품명', a: 't', w: 1, tip: 1 }, { h: '전일 판매가', a: 'r', k: 'n' }, { h: '금일 판매가', a: 'r', k: 'n' }, { h: '변동액', a: 'r', k: 'n', sg: 1 }, { h: '변동률', a: 'r', k: 'p1', sg: 1 }];
  var NCOLS = [{ h: '품목군', a: 't' }, { h: '상품명', a: 't', w: 1, tip: 1 }, { h: '카테고리', a: 't' }, { h: '판매가', a: 'r', k: 'n' }];
  var QCOLS = [{ h: '품목군', a: 't' }, { h: '상품명', a: 't', w: 1, tip: 1 }, { h: '판매가', a: 'r', k: 'n' }, { h: '수량할인가', a: 'r', k: 'n' }, { h: '할인율', a: 'r', k: 'p1' }, { h: '할인 조건', a: 't', w: 1 }];
  var DATA = null, DID = '', ONE = null;
  function $(id) { return document.getElementById(id); }
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function f(n) { return n == null || n === '' ? '-' : Number(n).toLocaleString('ko-KR'); }
  function lbl(d) { var p = String(d).split('-').map(Number); var w = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); return p[1] + '/' + p[2] + '(' + WD[w] + ')'; }

  /* ---- 목록 팝업 (모든 컬럼 정렬) ---- */
  var cols = [], cur = [], sortCol = -1, sortAsc = true;
  function openTable(title, legend, cs, rows) {
    cols = cs; cur = rows.slice(); sortCol = -1; sortAsc = true;
    $('mt').textContent = title + ' (' + cur.length + '건)';
    $('lg').textContent = legend;
    var h = '<tr>';
    cs.forEach(function (c, i) { h += '<th data-i="' + i + '">' + e(c.h) + '<span class="s"></span></th>'; });
    $('dh').innerHTML = h + '</tr>';
    $('dh').parentNode.classList.remove('ct');
    $('ov').querySelector('.md').style.maxWidth = '';
    render();
    $('ov').className = 'ov on';
    $('mb').scrollTop = 0;
    fit();
  }
  function closeList() { $('ov').className = 'ov'; }
  function sortBy(i) {
    if (sortCol === i) sortAsc = !sortAsc; else { sortCol = i; sortAsc = true; }
    cur.sort(function (a, b) {
      var x = a.v[i], y = b.v[i];
      if ((x == null || x === '') && (y == null || y === '')) return 0;
      if (x == null || x === '') return 1;
      if (y == null || y === '') return -1;
      var r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'ko');
      return sortAsc ? r : -r;
    });
    render();
  }
  // 좌우 스크롤이 생기지 않게: 표가 창보다 넓으면 글자 크기·칸 여백을 한 단계씩 줄임 (헤더는 한 줄 유지)
  //   [글자 px, 칸 좌우 여백 px, 1 = 좁은 화면용(품목군·경쟁사 칸도 줄바꿈 허용)]
  var FIT = [[12.5, 10], [12, 8], [11.5, 6], [11, 5], [10.5, 4], [11, 4, 1], [10.5, 3, 1], [10, 3, 1]];
  function fit() {
    var mb = $('mb'), t = mb.querySelector('table.dt');
    if (!t || $('ov').className.indexOf('on') < 0) return;
    for (var i = 0; i < FIT.length; i++) {
      t.style.fontSize = FIT[i][0] + 'px';
      t.style.setProperty('--px', FIT[i][1] + 'px');
      t.classList.toggle('tight', !!FIT[i][2]);
      if (mb.scrollWidth <= mb.clientWidth) break;
    }
  }
  function render() {
    var ths = document.querySelectorAll('#dh th');
    for (var i = 0; i < ths.length; i++) {
      ths[i].className = i === sortCol ? 'on' : '';
      ths[i].querySelector('.s').textContent = i === sortCol ? (sortAsc ? '▲' : '▼') : '⇅';
    }
    var h = '';
    cur.forEach(function (o) {
      h += '<tr>';
      cols.forEach(function (c, j) {
        var v = o.v[j], cls = c.a + (c.w ? ' nm' : '');
        if (c.sg) cls += ' ' + (o.sg > 0 ? 'pos' : o.sg < 0 ? 'neg' : 'zero');
        if (c.hl) { var x = c.hl(v); if (x) cls += ' ' + x; }
        var t = c.k === 'n' ? f(v) : c.k === 'p0' ? (v == null ? '-' : Math.round(v) + '%') : c.k === 'p1' ? (v == null ? '-' : v.toFixed(1) + '%') : e(v);
        h += '<td class="' + cls + '"' + (c.tip && o.tip ? ' title="' + e(o.tip) + '"' : '') + '>' + t + '</td>';
      });
      h += '</tr>';
    });
    if (!cur.length) h = '<tr><td colspan="' + cols.length + '" style="text-align:center;color:#888;padding:20px">해당 상품이 없습니다</td></tr>';
    $('tb').innerHTML = h;
    fit();
  }

  /* ---- 데이터 → 목록 ---- */
  var PFL = {
    all: function () { return true; },
    self: function (r) { return r[4] > r[3]; },
    comp: function (r) { return r[4] < r[3]; },
    same: function (r) { return r[4] === r[3]; }
  };
  var SFL = {
    neu: function (r) { return r[6] === '신규 발생'; },
    res: function (r) { return r[6] === '해소'; },
    cur: function (r) { return r[6] !== '해소'; },
    indef: function (r) { return r[4] === INDEF && r[6] !== '해소'; }
  };
  // x = { cn: 경쟁사명, r: [품목군, 상품명, 급여가, 조아 금액, 경쟁사 금액, 급여코드, 경쟁사 표기명, 대분류] }
  function priceRows(list, withComp) {
    return list.map(function (x) {
      var r = x.r, L = r[2], sp = r[3], cp = r[4];
      var v = [r[0], r[1], L, sp, L ? (L - sp) / L * 100 : null, cp, L ? (L - cp) / L * 100 : null, sp - cp, L ? (sp - cp) / L * 100 : null];
      if (withComp) v.unshift(x.cn);
      return { v: v, sg: sp - cp, tip: r[5] ? '급여코드 ' + r[5] + (r[6] ? ' · 경쟁사 표기: ' + r[6] : '') : '' };
    });
  }
  function shipRows(rows) {
    return rows.map(function (r) {
      return { v: [r[0], r[1], r[3], r[4], r[5], r[6]], tip: (r[2] ? '급여코드 ' + r[2] : '') + (r[7] ? (r[2] ? ' · ' : '') + '전일: ' + r[7] : '') };
    });
  }
  function catRows(cat) {
    var out = [];
    DATA.comp.forEach(function (c) { c.r.forEach(function (r) { if (r[7] === cat) out.push({ cn: c.n, r: r }); }); });
    return out;
  }
  function gLast(g) { return g === '(급여코드 없음)' || /^기타\(/.test(g) ? 1 : 0; }
  function gLabel(g) { return g === '(급여코드 없음)' ? '급여코드 없음' : g.replace(/^기타\(코드 (.+)\)$/, '기타 (코드 $1…)'); }
  function openTree(s) { // 상품수 → 대 카테고리 › 품목군 개수
    var c = s.cats, total = 0, h = '';
    var cats = Object.keys(c).map(function (a) {
      var gs = Object.keys(c[a]).sort(function (x, y) { return gLast(x) - gLast(y) || c[a][y] - c[a][x]; });
      var t = 0; gs.forEach(function (g) { t += c[a][g]; });
      return { a: a, gs: gs, t: t };
    });
    cats.sort(function (x, y) { return y.t - x.t; });
    cats.forEach(function (x) {
      total += x.t;
      x.gs.forEach(function (g, j) {
        h += '<tr>' + (j === 0 ? '<td class="t cat" rowspan="' + x.gs.length + '">' + e(x.a) + '</td><td class="r sub" rowspan="' + x.gs.length + '">' + x.t + '</td>' : '')
          + '<td class="t' + (gLast(g) ? ' dim' : '') + '">' + e(gLabel(g)) + '</td><td class="r">' + c[x.a][g] + '</td></tr>';
      });
    });
    h += '<tr class="tot"><td class="t" colspan="2">합계</td><td></td><td class="r">' + total + '</td></tr>';
    cols = []; cur = []; sortCol = -1;
    $('mt').textContent = s.n + ' — 상품수 ' + total + ' (대 카테고리 › 품목군)';
    $('lg').textContent = '대 카테고리 = 각 사이트의 상품 분류 · 품목군 = 급여코드 앞자리 기준 · 많은 순 (급여코드가 없는 상품은 "급여코드 없음")';
    $('dh').innerHTML = '<tr><th>대 카테고리</th><th>소계</th><th>품목군</th><th>상품수</th></tr>';
    $('dh').parentNode.classList.add('ct');
    $('ov').querySelector('.md').style.maxWidth = '720px';
    $('tb').innerHTML = h;
    $('ov').className = 'ov on';
    $('mb').scrollTop = 0;
    fit();
  }
  function openView(vw) {
    var p = String(vw).split('-'), t = p[0], i = +p[1], fl = p[2];
    if (!DATA) return;
    if (t === 'p' && DATA.comp[i] && PF[fl]) {
      var c = DATA.comp[i];
      openTable(c.n + ' — ' + PF[fl], PLEG, PCOLS, priceRows(c.r.filter(PFL[fl]).map(function (r) { return { cn: c.n, r: r }; }), false));
    } else if (t === 'g' && DATA.cats[i] != null && GF[fl]) {
      var cat = DATA.cats[i];
      openTable(cat + ' — ' + GF[fl] + ' (경쟁사 전체)', PLEG, [{ h: '경쟁사', a: 'c' }].concat(PCOLS), priceRows(catRows(cat).filter(function (x) { return PFL[fl](x.r); }), true));
    } else if (t === 's' && DATA.ship[i] && SF[fl]) {
      var s = DATA.ship[i];
      openTable(s.n + ' — ' + SF[fl], SLEG, SCOLS, shipRows(s.r.filter(SFL[fl])));
    } else if (DATA.sites && DATA.sites[i]) {
      var o = DATA.sites[i];
      if (t === 'c') openTree(o);
      else if (t === 'u' && UF[fl]) openTable(o.n + ' — ' + UF[fl], ULEG, UCOLS, o[fl].map(function (r) { var d = r[3] - r[2]; return { v: [r[0], r[1], r[2], r[3], d, r[2] ? d / r[2] * 100 : null], sg: d, tip: r[4] ? '급여코드 ' + r[4] : '' }; }));
      else if (t === 'n' && NF[fl]) openTable(o.n + ' — ' + NF[fl], NLEG[fl], NCOLS, o[fl].map(function (r) { return { v: [r[0], r[1], r[2], r[3]], tip: r[4] ? '급여코드 ' + r[4] : '' }; }));
      else if (t === 'q') openTable(o.n + ' — 수량할인 상품', QLEG, QCOLS, o.qty.map(function (r) { return { v: [r[0], r[1], r[2], r[3], r[2] ? (r[2] - r[3]) / r[2] * 100 : null, r[4]], tip: r[5] ? '급여코드 ' + r[5] : '' }; }));
    }
  }

  /* ---- 요약표 3개 (메일과 같은 표, 숫자 클릭 → 목록) ---- */
  function num(vw, n, color) {
    return n ? '<a href="#" class="num" data-v="' + vw + '" style="color:' + color + '">' + n + '</a>' : String(n);
  }
  function avgAbs(rows) {
    if (!rows.length) return null;
    var s = 0; rows.forEach(function (r) { s += Math.abs(r[4] - r[3]) / r[3] * 100; });
    return Math.round(s / rows.length * 10) / 10;
  }
  function siteSec() {
    if (!DATA.sites || !DATA.sites.length) return '';
    var h = '<h3>사이트별 현황</h3><table class="sm"><tr><th>사이트</th><th>상품수</th><th>인상</th><th>인하</th><th>정책</th><th>수량할인</th><th>신규</th><th>삭제</th><th>출고이슈</th><th>무기한</th></tr>';
    DATA.sites.forEach(function (s, si) {
      var tot = 0, a, g;
      for (a in s.cats) for (g in s.cats[a]) tot += s.cats[a][g];
      var shi = -1;
      (DATA.ship || []).forEach(function (x, j) { if (x.n === s.n) shi = j; });

      h += '<tr' + (s.self ? ' style="background:#E2EFDA"' : '') + '><td style="text-align:left">' + e(s.n) + (s.self ? ' <b>(자사)</b>' : '') + '</td><td>' + num('c-' + si + '-all', tot, '#1F3864')
        + '</td><td>' + num('u-' + si + '-up', s.up.length, '#C00000') + '</td><td>' + num('u-' + si + '-down', s.down.length, '#1F4E9E') + '</td><td>' + e(s.dir)
        + '</td><td>' + num('q-' + si + '-all', s.qty.length, '#1F3864') + '</td><td>' + num('n-' + si + '-add', s.add.length, '#1F3864') + '</td><td>' + num('n-' + si + '-del', s.del.length, '#555')
        + '</td><td>' + num('s-' + shi + '-cur', sc('cur'), '#1F3864') + '</td><td>' + num('s-' + shi + '-indef', sc('indef'), '#C00000') + '</td></tr>';
    });

  }
  function priceSec() {
    if (!DATA.comp.length) return '';

    DATA.comp.forEach(function (c, ci) {

        + '</td><td>' + num('p-' + ci + '-comp', k.length, '#C00000') + av(k) + '</td><td>' + num('p-' + ci + '-same', m.length, '#555') + '</td></tr>';

  function shipSec() {

    DATA.ship.forEach(function (s, si) {

        + '</td><td>' + num('s-' + si + '-cur', c('cur'), '#1F3864') + '</td><td>' + num('s-' + si + '-indef', c('indef'), '#C00000') + '</td></tr>';

  function catSec() {
    if (!DATA.cats || !DATA.cats.length) return '';
    var h = '<h3>품목군별 요약 (대분류)</h3><table class="sm"><tr><th>품목군</th><th>비교 건수</th><th>조아 더 저렴</th><th>경쟁사 더 저렴</th><th>평균차</th></tr>';
    DATA.cats.forEach(function (cat, gi) {

      h += '<tr><td><b>' + e(cat) + '</b></td><td>' + num('g-' + gi + '-all', rows.length, '#1F3864') + '</td><td>' + num('g-' + gi + '-self', rows.filter(PFL.self).length, '#1F4E9E')

  function page() {

  /* ---- 데이터 받기 ---- */
  function b64u(s) {
    var b = s.replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    var bin = atob(b), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  async function gunzip(u) {
    if (typeof DecompressionStream === 'undefined') throw new Error('old');
    return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  }
  async function getBin(id) {
    var urls = ['d/' + id + '.bin', 'https://raw.githubusercontent.com/' + CFG.repo + '/main/d/' + id + '.bin'];
    for (var i = 0; i < urls.length; i++) {
      try { var r = await fetch(urls[i], { cache: 'no-store' }); if (r.ok) return new Uint8Array(await r.arrayBuffer()); } catch (x) {}
    }
    throw new Error('nf');
  }
  async function open3(id, key) {
    if (!window.crypto || !crypto.subtle) throw new Error('old');
    var bin = await getBin(id);
    var k = await crypto.subtle.importKey('raw', b64u(key), 'AES-GCM', false, ['decrypt']);
    var pt;
    try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin.slice(0, 12) }, k, bin.slice(12)); } catch (x) { throw new Error('bad'); }
    return gunzip(new Uint8Array(pt));
  }
  function fromV2(o) { // 예전 메일 링크(가격 경쟁력만 담긴 형식)
    return {
      d: o.d, cats: [], ship: [], sites: [],
      comp: o.c.map(function (c) {
        var r = [];
        for (var i = 0; i < c.r.length; i += 2) { var j = c.r[i] * 4, sp = o.p[j + 3]; r.push([o.g[o.p[j]], o.p[j + 1], o.p[j + 2], sp, sp + c.r[i + 1], '', '', null]); }
        return { n: c.n, r: r };
      })
    };
  }
  function showOne() { if (ONE) openTable(ONE.c + ' — ' + ONE.f, PLEG, PCOLS, priceRows(ONE.r.map(function (r) { return { cn: ONE.c, r: r }; }), false)); }
  async function load() {
    var h = location.hash.replace(/^#/, ''), msg = $('msg');
    try {
      if (EMBED) {
        if (!DATA) { DATA = EMBED; page(); }
        if (/^[psgcunq]-\d+-[a-z]+$/.test(h)) openView(h);
        return;
      }
      if (!h) { msg.textContent = '메일의 숫자를 눌러서 열어 주세요.'; return; }
      var m3 = h.match(/^([0-9a-f]{16})\.([A-Za-z0-9_-]{43})(?:\.([psgcunq]-\d+-[a-z]+))?$/);
      if (m3) {
        if (DID !== m3[1]) { msg.textContent = '불러오는 중…'; DATA = await open3(m3[1], m3[2]); DID = m3[1]; page(); }
        if (m3[3]) openView(m3[3]);
        return;
      }
      var m2 = h.match(/^(\d+)\.(all|self|comp|same)\.(.+)$/);
      if (m2) {
        if (DID !== m2[3]) { DATA = fromV2(await gunzip(b64u(m2[3]))); DID = m2[3]; page(); }
        openView('p-' + m2[1] + '-' + m2[2]);
        return;
      }
      ONE = await gunzip(b64u(h)); // 가장 예전 형식: 목록 하나
      $('ttl').textContent = '조아 vs 경쟁사 가격 비교 — ' + lbl(ONE.d);
      msg.textContent = ONE.c + ' · ' + ONE.f + ' ' + ONE.r.length + '건 (같은 급여코드 기준)';
      $('again').style.display = 'inline-block';
      showOne();
    } catch (err) {
      var m = err && err.message;
      msg.textContent = m === 'old' ? '브라우저가 오래되어 열 수 없습니다. 크롬·엣지 등 최신 브라우저로 열어 주세요. (메일 첨부 HTML로도 볼 수 있습니다)'
        : m === 'nf' ? '데이터를 찾지 못했습니다. 메일이 막 도착했다면 1~2분 뒤 새로고침해 주세요. (메일 첨부 HTML로도 볼 수 있습니다)'
        : '링크가 잘렸거나 손상되었습니다. 메일 첨부 HTML로 확인해 주세요.';
    }
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var a = t.closest && t.closest('a[data-v]');
    if (a) { ev.preventDefault(); openView(a.getAttribute('data-v')); return; }

  });
